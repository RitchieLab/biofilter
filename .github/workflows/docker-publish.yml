name: Publish Docker Image

# One image, two registries. Docker Hub is the general handle; the GHCR
# `biofilter-hpc` name predates the merge of the two images and is kept
# so `apptainer pull` lines already in cluster scripts keep resolving.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional tag (example: 4.3.0). If empty, uses manual-<sha>."
        required: false
        type: string
      push_latest:
        description: "Also publish :latest"
        required: false
        default: true
        type: boolean

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_IMAGE: ricoandre/biofilter
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/biofilter-hpc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is optional: a fork without the secrets still publishes
      # to GHCR rather than failing the whole job.
      - name: Check Docker Hub credentials
        id: dockerhub
        shell: bash
        run: |
          if [[ -n "${{ secrets.DOCKERHUB_USERNAME }}" && -n "${{ secrets.DOCKERHUB_TOKEN }}" ]]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Docker Hub secrets absent; publishing to GHCR only."
          fi

      - name: Login to Docker Hub
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          GHCR_LC="${GHCR_IMAGE,,}"

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            VERSION_TAG="${GITHUB_REF_NAME#v}"
            PUSH_LATEST="true"
          else
            INPUT_TAG="${{ github.event.inputs.image_tag }}"
            PUSH_LATEST="${{ github.event.inputs.push_latest }}"
            VERSION_TAG="${INPUT_TAG:-manual-${GITHUB_SHA::7}}"
          fi

          TAGS="${GHCR_LC}:${VERSION_TAG}"
          [[ "${PUSH_LATEST}" == "true" ]] && TAGS="${TAGS},${GHCR_LC}:latest"

          if [[ "${{ steps.dockerhub.outputs.available }}" == "true" ]]; then
            TAGS="${TAGS},${DOCKERHUB_IMAGE}:${VERSION_TAG}"
            [[ "${PUSH_LATEST}" == "true" ]] && TAGS="${TAGS},${DOCKERHUB_IMAGE}:latest"
          fi

          echo "tags=${TAGS}" >> "${GITHUB_OUTPUT}"
          echo "Using tags: ${TAGS}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
