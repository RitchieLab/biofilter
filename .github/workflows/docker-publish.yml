name: Publish Docker Image

# One image, one registry: ghcr.io/<owner>/biofilter.
#
# GHCR authenticates with the workflow's own token, so publishing needs
# no secrets and works in a fork. The image carries no data — a bundle is
# bind-mounted at run time — so the same image serves Docker locally and
# Apptainer on a cluster.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional tag (example: 4.3.0). If empty, uses manual-<sha>."
        required: false
        type: string
      push_latest:
        description: "Also publish :latest"
        required: false
        default: true
        type: boolean

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/biofilter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_LC="${IMAGE,,}"

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            VERSION_TAG="${GITHUB_REF_NAME#v}"
            PUSH_LATEST="true"
          else
            INPUT_TAG="${{ github.event.inputs.image_tag }}"
            PUSH_LATEST="${{ github.event.inputs.push_latest }}"
            VERSION_TAG="${INPUT_TAG:-manual-${GITHUB_SHA::7}}"
          fi

          TAGS="${IMAGE_LC}:${VERSION_TAG}"
          [[ "${PUSH_LATEST}" == "true" ]] && TAGS="${TAGS},${IMAGE_LC}:latest"

          echo "tags=${TAGS}" >> "${GITHUB_OUTPUT}"
          echo "Using tags: ${TAGS}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
