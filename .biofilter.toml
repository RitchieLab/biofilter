[database]
db_uri = "postgresql+psycopg2://admin:admin@localhost/biofilter_dev"
# Production is a read-only Parquet bundle on the LPC:
#   db_uri = "parquet:///project/hall_shared/datasets/biofilter/<YYYYMMDD>/tables"
# If a PostgreSQL server is provisioned again, keep credentials OUT of this file
# (use the DATABASE_URL env var) — see lpc__deploy.md Appendix A.
echo_sql = false
auto_create = false

[etl]
data_root = "./biofilter_data"
allow_parallel = true
max_workers = 8

[reports]
default_output_format = "dataframe"
warn_on_empty = true

[logging]
level = "INFO"
log_to_file = true
log_file = "./biofilter.log"
