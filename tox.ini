[tox]
envlist = py310, py311, py312, py313

# tox builds the package with poetry-core and installs it together with the
# runtime dependencies resolved from pyproject.toml, so the envs only need the
# test-only extras on top. Do not add `poetry install` back here: it is
# redundant, and poetry sharing an env with the package under test makes the
# two compete over common dependencies such as `packaging`.

[testenv]
deps = pytest
commands = pytest {posargs:tests/}

# basepython is pinned per interpreter because the 3.10-3.12 builds come from
# pyenv and 3.13 from Homebrew; adjust the paths for your own machine.

[testenv:py310]
basepython = /Users/andrerico/.pyenv/versions/3.10.3/bin/python

[testenv:py311]
basepython = /Users/andrerico/.pyenv/versions/3.11.9/bin/python

[testenv:py312]
basepython = /Users/andrerico/.pyenv/versions/3.12.3/bin/python

[testenv:py313]
basepython = /opt/homebrew/bin/python3.13
